<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=`, initial-scale=1.0">
    <title>Freinds Screen-Kokoa Clone</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="status-bar">
        <div class="status-bar__column">
            <span>No Service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="status-bar__column">
            <span>18:43</span>
        </div>
        <div class="status-bar__column">
            <span>110%</span>
            <i class="fa-solid fa-battery-full fa-lg"></i>
            <i class="fa-solid fa-bolt-lightning"></i>
        </div>
    </div>
    <header class="screens-header">
        <h1 class="screens-header__title">Friends</h1>
        <div class="screens-header__icons">
            <span><i class="fa-brands fa-sistrix fa-3x"></i></span>
            <span><i class="fa-solid fa-music fa-3x"></i></i></span>
            <span><i class="fa-solid fa-gear fa-3x"></i></span>

        </div>
    </header>

    <a id="friends-display-link" href="#">
        <i class="fa-solid fa-circle-info"></i>Friends' Names Display<i class="fa-solid fa-angle-right fa-sm"></i>
    </a>
    <main class="main-screen">
        <div class="user-component">
            <div class="user-component__column">
                <img src="screenshot/증명사진.jpeg" class="user-component__avatar user-component__avatar--xl"/>
                <div class="user-component__text">
                    <h4 class="user-component_title">Nicolas</h4>
                    <!--<h6 class="user-component_subtitle">This text Whatever</h6>-->
                </div>
            </div>
            <div class="user-component__column"></div>
        </div>
        <div class="friends-screen__channel">
            <div class="friend-screen__channel-header">
                <span>Channel</span>
                <i class="fa-solid fa-angle-up"></i>
            </div>
        </div>
        <div class="user-component">
            <div class="user-component__column">
                <img src="screenshot/증명사진.jpeg" class="user-component__avatar user-component__avatar--sm"/>
                <!-- 위의 user-component는 상대적으로 큰그림, 아래 user-component는 작은 그림이다.-->
                <div class="user-component__text">
                    <h4 class="user-component_title user-component__title--not-bold">Channel</h4>
                </div>
            </div>
            <div class="user-component__column">
                <div>
                    <span>2</span>
                    <i class="fa-solid fa-angle-right fa-sm"></i>
                </div>
            </div>
        </div>
        
    </main>
    
    <nav class="nav">
        <ul class="nav__list">
            <li class="nav__btn">
                <a class="nav__link" href="friends.html"><i class="fa-solid fa-user fa-3x"></i></a>
            </li>
            <li class="nav__btn">
                <a class="nav__link" href="chats.html">
                    <span class="nav__notification badge">1</span>
                    <i class="fa-regular fa-comment fa-3x"></i></a>
            </li>
            <li class="nav__btn">
                <a class="nav__link" href="find.html"><i class="fa-brands fa-sistrix fa-3x"></i></a>
            </li>
            <li class="nav__btn">
                <a class="nav__link" href="more.html">
                    <span class="nav__notification_dot"></span>
                    <i class="fa-solid fa-ellipsis fa-3x"></i></a>
            </li>
        </ul>
    </nav>
    <div id="splash-screen">
        <i class="fa-solid fa-comment"></i>
    </div>

    <div id="no-mobile">
        <span>Your screen is too big ㅠㅠ</span>
    </div>
    <script src="https://kit.fontawesome.com/6b65280b65.js" crossorigin="anonymous"></script>
</body>
</html>
